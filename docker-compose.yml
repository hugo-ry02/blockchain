services:
  pc-alice:
    build: .
    container_name: blockchain-pc-alice
    environment:
      - NODE_ID=pc-alice
      - PORT=5000
      - DIFFICULTY=4
      - PEERS=http://pc-bob:5000,http://pc-charlie:5000
    ports:
      - "5001:5000"
    networks:
      - blockchain-net

  pc-bob:
    build: .
    container_name: blockchain-pc-bob
    environment:
      - NODE_ID=pc-bob
      - PORT=5000
      - DIFFICULTY=4
      - PEERS=http://pc-alice:5000,http://pc-charlie:5000
    ports:
      - "5002:5000"
    networks:
      - blockchain-net

  pc-charlie:
    build: .
    container_name: blockchain-pc-charlie
    environment:
      - NODE_ID=pc-charlie
      - PORT=5000
      - DIFFICULTY=4
      - PEERS=http://pc-alice:5000,http://pc-bob:5000
    ports:
      - "5003:5000"
    networks:
      - blockchain-net

networks:
  blockchain-net:
    driver: bridge
