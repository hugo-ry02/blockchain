services:
  pc-hugo:
    build: .
    container_name: blockchain-pc-hugo
    environment:
      - NODE_ID=pc-hugo
      - PORT=5000
      - DIFFICULTY=4
      - PEERS=http://pc-enzo:5000,http://pc-louis:5000
    ports:
      - "5001:5000"
    networks:
      - blockchain-net

  pc-enzo:
    build: .
    container_name: blockchain-pc-enzo
    environment:
      - NODE_ID=pc-enzo
      - PORT=5000
      - DIFFICULTY=4
      - PEERS=http://pc-hugo:5000,http://pc-louis:5000
    ports:
      - "5002:5000"
    networks:
      - blockchain-net

  pc-louis:
    build: .
    container_name: blockchain-pc-louis
    environment:
      - NODE_ID=pc-louis
      - PORT=5000
      - DIFFICULTY=4
      - PEERS=http://pc-hugo:5000,http://pc-enzo:5000
    ports:
      - "5003:5000"
    networks:
      - blockchain-net

networks:
  blockchain-net:
    driver: bridge
